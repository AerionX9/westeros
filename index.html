<!DOCTYPE html>
<html lang="fr">
<head>

  <style>
    :root {
      --ink: #f4ead4; --muted: #b7a48a; --gold: #d4af6a; --blood: #8b1e1e; --bg: #120e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Source Serif 4", Georgia, serif; }
    body {
      background:
        radial-gradient(ellipse 90% 50% at 50% -8%, rgba(90,18,18,.4), transparent 55%),
        repeating-linear-gradient(135deg, rgba(255,220,160,.03) 0 1px, transparent 1px 16px),
        #14100c;
      padding: 16px 14px 28px;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-family: Cinzel, serif; font-size: clamp(26px, 6vw, 40px); text-align: center; line-height: 1.2; }
    .lede { text-align: center; color: var(--gold); font-style: italic; margin: 8px 0 18px; }
    .hud {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      margin: 0 0 14px; font-family: Cinzel, serif; font-size: 11px; letter-spacing: .08em;
    }
    .hud b { color: var(--gold); font-weight: 600; }
    .chip {
      border: 1px solid rgba(212,175,106,.35); padding: 6px 10px; background: rgba(0,0,0,.25);
    }
    .screen { display: none; }
    .screen.on { display: block; animation: up .35s ease; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .btn {
      font-family: Cinzel, serif; letter-spacing: .12em; text-transform: uppercase; font-size: 11px;
      border: 1px solid var(--gold); background: transparent; color: var(--gold);
      padding: 12px 16px; cursor: pointer; touch-action: manipulation;
    }
    .btn.solid { background: var(--gold); color: #1a1208; }
    .btn:disabled { opacity: .35; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
    .crest-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 10px 0 16px; }
    .crest-row svg { width: 44px; height: 44px; }
    .intro p, .event p, .end p { max-width: 36em; margin: 0 auto 16px; line-height: 1.65; text-align: center; color: #ead9b8; }
    .q-meta { font-family: Cinzel, serif; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    h2 { font-size: clamp(18px, 4vw, 24px); margin-bottom: 12px; }
    .choices { display: grid; gap: 8px; }
    .choice {
      text-align: left; width: 100%; background: rgba(255,255,255,.04);
      border: 1px solid rgba(244,234,212,.14); color: var(--ink);
      font: 16px/1.4 "Source Serif 4", serif; padding: 12px; cursor: pointer;
    }
    .choice.picked { border-color: var(--gold); background: rgba(212,175,106,.16); }
    .progress { height: 3px; background: #2a2118; margin-bottom: 14px; }
    .progress i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
    .map {
      position: relative; height: min(62vh, 520px);
      background:
        radial-gradient(circle at 50% 18%, rgba(200,220,255,.08), transparent 28%),
        radial-gradient(circle at 28% 70%, rgba(80,140,80,.12), transparent 30%),
        radial-gradient(circle at 72% 78%, rgba(210,140,60,.12), transparent 32%),
        linear-gradient(#1a1712, #0e0c0a);
      border: 1px solid rgba(212,175,106,.28); overflow: hidden;
    }
    .pin {
      position: absolute; transform: translate(-50%,-50%);
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #1a1208; background: var(--gold); cursor: pointer;
      box-shadow: 0 0 0 4px rgba(212,175,106,.15);
    }
    .pin.done { background: #6e5f4c; }
    .pin.here { box-shadow: 0 0 0 6px rgba(212,175,106,.35); }
    .pin span {
      position: absolute; left: 22px; top: -2px; white-space: nowrap;
      font-family: Cinzel, serif; font-size: 10px; letter-spacing: .08em; color: var(--gold);
      text-shadow: 0 1px 4px #000;
    }
    .you {
      position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
      background: #fff; border-radius: 50%; pointer-events: none;
      box-shadow: 0 0 12px #fff; transition: left .6s ease, top .6s ease;
    }
    .log { min-height: 48px; color: var(--muted); text-align: center; margin-top: 10px; font-size: 15px; }
    .bars { margin-top: 14px; }
    .bar-row { display: grid; grid-template-columns: 28px 90px 1fr 28px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; color: var(--muted); }
    .bar { height: 6px; background: #2a2118; }
    .bar i { display: block; height: 100%; }
    .sigil-box { width: 140px; height: 140px; margin: 8px auto; display: grid; place-items: center; }
    .sigil-box svg { width: 110px; height: 110px; }
    .house-name { font-family: Cinzel, serif; font-size: clamp(24px, 6vw, 38px); text-align: center; }
    .words { text-align: center; color: var(--gold); font-style: italic; margin: 6px 0 12px; }
    .combat { text-align: center; }
    .hp { font-family: Cinzel, serif; margin: 8px 0 14px; }
    footer { text-align: center; color: #5c4d3c; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud" id="hud" style="display:none"></div>

    <section class="screen on" id="title">
      <div class="crest-row" id="miniCrests"></div>
      <h1>Quelle est ta maison&nbsp;?</h1>
      <p class="lede">Un serment. Une carte. Une guerre froide.</p>
      <p>Douze questions pour trouver ta bannière. Ensuite tu voyages : ports, cours, bois. Tes choix changent l’or, l’honneur et le sang.</p>
      <div class="row">
        <button class="btn solid" id="startBtn">Commencer</button>
        <button class="btn" id="loadBtn">Reprendre</button>
      </div>
    </section>

    <section class="screen" id="quiz">
      <div class="progress"><i id="bar"></i></div>
      <div class="q-meta" id="meta"></div>
      <h2 id="question"></h2>
      <div class="choices" id="choices"></div>
      <div class="row">
        <button class="btn" id="backBtn">Retour</button>
        <button class="btn solid" id="nextBtn" style="display:none">Continuer</button>
      </div>
    </section>

    <section class="screen" id="reveal">
      <div class="banner q-meta" style="text-align:center">Ta maison</div>
      <div class="sigil-box" id="resSigil"></div>
      <div class="house-name" id="resName"></div>
      <div class="words" id="resWords"></div>
      <p id="resBlurb"></p>
      <div class="bars" id="bars"></div>
      <div class="row"><button class="btn solid" id="toMapBtn">Prendre la route</button></div>
    </section>

    <section class="screen" id="map">
      <div class="map" id="mapBox">
        <div class="you" id="you"></div>
      </div>
      <p class="log" id="mapLog">Choisis une terre.</p>
      <div class="row">
        <button class="btn" id="invBtn">Sac</button>
        <button class="btn" id="saveBtn">Sauvegarder</button>
      </div>
    </section>

    <section class="screen" id="event">
      <div class="q-meta" id="evPlace"></div>
      <h2 id="evTitle"></h2>
      <p id="evText"></p>
      <div class="choices" id="evChoices"></div>
      <div class="row"><button class="btn" id="evBack">Carte</button></div>
    </section>

    <section class="screen combat" id="combat">
      <div class="q-meta" id="cbName"></div>
      <p id="cbText"></p>
      <div class="hp" id="cbHp"></div>
      <div class="row">
        <button class="btn solid" id="atkBtn">Frapper</button>
        <button class="btn" id="defBtn">Garder</button>
        <button class="btn" id="fleeBtn">Fuir</button>
      </div>
      <p class="log" id="cbLog"></p>
    </section>

    <section class="screen" id="bag">
      <h2 style="text-align:center">Sac</h2>
      <p id="bagText" style="text-align:center"></p>
      <div class="row"><button class="btn solid" id="bagClose">Fermer</button></div>
    </section>

    <section class="screen" id="end">
      <h1 id="endTitle"></h1>
      <p id="endText"></p>
      <div class="row"><button class="btn solid" id="againBtn">Recommencer</button></div>
    </section>

    <footer>Fan game. Pas affilié à HBO ni à George R. R. Martin.</footer>
  </div>

  { id: "kings", name: "Port-Réal", x: "50%", y: "58%",
    title: "La fosse",
    text: "Un prêteur te propose un nom à la cour contre vingt pièces — ou un duel dans la boue.",
    choices: [
      { t: "Payer 20, or et faveur.", act: "pay", gold: 20, honor: -1, item: "faveur de cour" },
      { t: "Duel.", act: "fight", foe: "champion de fosse", hp: 12 },
      { t: "Écouter et partir. Esprit +1.", act: "stat", wit: 1 }
    ]},
  { id: "highgarden", name: "Hautjardin", x: "38%", y: "68%",
    title: "La rose",
    text: "On t’offre du vin et un contrat de blé. Trop beau.",
    choices: [
      { t: "Signer. Or +25, honor -1.", act: "stat", gold: 25, honor: -1 },
      { t: "Manger, rien signer. PV +4.", act: "stat", hp: 4 },
      { t: "Voler une rose. Objet.", act: "stat", item: "rose séchée", honor: -2 }
    ]},
  { id: "pyke", name: "Pyk", x: "22%", y: "42%",
    title: "Les noyés",
    text: "Un capitaine te défie de prendre un cotre. La mer est mauvaise.",
    choices: [
      { t: "Embarquer. Mer + or.", act: "stat", gold: 18, item: "sel noir" },
      { t: "Payer le tribut, 12.", act: "pay", gold: 12 },
      { t: "Se battre sur les rochers.", act: "fight", foe: "reaver", hp: 11 }
    ]},
  { id: "sunspear", name: "Lanceclaire", x: "62%", y: "86%",
    title: "L’ombre",
    text: "On te parle d’une dette vieille de dix ans. Vengeance ou oubli.",
    choices: [
      { t: "Attendre. Esprit +2.", act: "stat", wit: 2 },
      { t: "Frapper maintenant.", act: "fight", foe: "lame du désert", hp: 11 },
      { t: "Pardonner. Honor +2.", act: "stat", honor: 2 }
    ]},
  { id: "eyrie", name: "Les Eyrié", x: "62%", y: "32%",
    title: "La lune",
    text: "Un juge veut te voir « dans le ciel ». Tu peux parler, payer, ou te taire.",
    choices: [
      { t: "Parler. Esprit 2 requis.", act: "wit", need: 3, honor: 2 },
      { t: "Payer 16.", act: "pay", gold: 16 },
      { t: "Se taire et descendre.", act: "stat", honor: -1 }
    ]}
];

const $ = (id) => document.getElementById(id);
const score = Object.fromEntries(Object.keys(HOUSES).map((k) => [k, 0]));
let picks = [];
let i = 0, deck = [];
const QCOUNT = 12;
let P = null;
let combat = null;

document.getElementById("miniCrests").innerHTML = Object.keys(SVG).map((k) => SVG[k]).join("");

function show(id) {
  ["title", "quiz", "reveal", "map", "event", "combat", "bag", "end"].forEach((s) => $(s).classList.toggle("on", s === id));
  $("hud").style.display = P && id !== "title" ? "flex" : "none";
  if (P) drawHud();
}
function shuffle(a) {
  a = a.slice();
  for (let n = a.length - 1; n > 0; n--) { const j = Math.floor(Math.random() * (n + 1)); const t = a[n]; a[n] = a[j]; a[j] = t; }
  return a;
}
function newQuiz() {
  deck = shuffle(QS).slice(0, QCOUNT).map((q) => ({ t: q.t, a: shuffle(q.a) }));
  picks = Array(deck.length).fill(-1); i = 0;
  Object.keys(score).forEach((k) => score[k] = 0);
}
function drawHud() {
  if (!P) return;
  $("hud").innerHTML =
    '<span class="chip">' + P.houseName + '</span>' +
    '<span class="chip">PV <b>' + P.hp + '</b></span>' +
    '<span class="chip">Or <b>' + P.gold + '</b></span>' +
    '<span class="chip">Honneur <b>' + P.honor + '</b></span>' +
    '<span class="chip">Esprit <b>' + P.wit + '</b></span>';
}
function startHero(houseId) {
  const h = HOUSES[houseId];
  P = {
    house: houseId, houseName: "Maison " + h.name, color: h.color,
    hp: 16 + (h.bonus.hp || 0), gold: 30 + (h.bonus.gold || 0),
    honor: 3 + (h.bonus.honor || 0), wit: 1 + (h.bonus.wit || 0),
    fight: 1 + (h.bonus.fight || 0), items: [], done: {},
    x: "50%", y: "50%", visits: 0
  };
}

function renderQ() {
  const q = deck[i] || QS[i];
  $("meta").textContent = "Question " + (i + 1) + " / " + deck.length;
  $("bar").style.width = ((i / deck.length) * 100) + "%";
  $("question").textContent = q.t;
  $("choices").innerHTML = "";
  q.a.forEach((opt, idx) => {
    const b = document.createElement("button");
    b.className = "choice" + (picks[i] === idx ? " picked" : "");
    b.textContent = opt[0];
    b.onclick = () => {
      picks[i] = idx;
      [...$("choices").children].forEach((c, j) => c.classList.toggle("picked", j === idx));
      $("nextBtn").disabled = false;
      clearTimeout(window._adv);
      window._adv = setTimeout(() => $("nextBtn").click(), 5000);
    };
    $("choices").appendChild(b);
  });
  $("nextBtn").disabled = picks[i] < 0;
}
function tally() {
  Object.keys(score).forEach((k) => score[k] = 0);
  picks.forEach((p, qi) => {
    if (p < 0) return;
    (deck[qi] || QS[qi]).a[p].slice(1).forEach((h) => score[h]++);
  });
  const ranked = Object.keys(score).sort((a, b) => score[b] - score[a]);
  const win = ranked[0];
  const h = HOUSES[win];
  startHero(win);
  $("resSigil").innerHTML = SVG[win];
  $("resName").textContent = "Maison " + h.name;
  $("resName").style.color = h.color;
  $("resWords").textContent = "« " + h.words + " »";
  $("resBlurb").textContent = h.blurb;
  const max = Math.max(...Object.values(score), 1);
  $("bars").innerHTML = ranked.map((k) => {
    const pct = Math.round(score[k] / max * 100);
    return '<div class="bar-row">' + SVG[k] + "<span>" + HOUSES[k].name + '</span><div class="bar"><i style="width:' + pct + "%;background:" + HOUSES[k].color + '"></i></div><span>' + score[k] + "</span></div>";
  }).join("");
  show("reveal");
}

function buildMap() {
  const box = $("mapBox");
  [...box.querySelectorAll(".pin")].forEach((n) => n.remove());
  PLACES.forEach((p) => {
    const d = document.createElement("button");
    d.className = "pin" + (P.done[p.id] ? " done" : "");
    d.style.left = p.x; d.style.top = p.y;
    d.innerHTML = "<span>" + p.name + "</span>";
    d.onclick = () => goPlace(p);
    box.appendChild(d);
  });
  $("you").style.left = P.x; $("you").style.top = P.y;
}
function goPlace(p) {
  P.x = p.x; P.y = p.y;
  $("you").style.left = p.x; $("you").style.top = p.y;
  if (P.done[p.id]) { $("mapLog").textContent = p.name + " : déjà visité."; return; }
  $("evPlace").textContent = p.name;
  $("evTitle").textContent = p.title;
  $("evText").textContent = p.text;
  $("evChoices").innerHTML = "";
  p.choices.forEach((c) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = c.t;
    b.onclick = () => resolve(p, c);
    $("evChoices").appendChild(b);
  });
  show("event");
}
function applyStat(c) {
  if (c.hp) P.hp += c.hp;
  if (c.gold) P.gold += c.gold;
  if (c.honor) P.honor += c.honor;
  if (c.wit) P.wit += c.wit;
  if (c.item) P.items.push(c.item);
  if (P.hp > 24) P.hp = 24;
}
function resolve(place, c) {
  if (c.act === "pay") {
    if (P.gold < c.gold) { $("evText").textContent = "Pas assez d’or."; return; }
    P.gold -= c.gold;
    applyStat(c);
    finishPlace(place, "Le passage est payé.");
  } else if (c.act === "fight") {
    startFight(place, c);
  } else if (c.act === "gamble") {
    const ok = Math.random() < 0.5;
    if (ok) { P.gold += 20; finishPlace(place, "Tu sors plus riche. +20 or."); }
    else { P.hp -= 4; finishPlace(place, "Le vin était un piège. -4 PV."); }
  } else if (c.act === "wit") {
    if (P.wit >= (c.need || 3)) { applyStat(c); finishPlace(place, "Ta langue sauve ta peau."); }
    else finishPlace(place, "Tes mots tombent dans le vide. Honor -1."), P.honor -= 1;
  } else {
    applyStat(c);
    finishPlace(place, "C’est noté.");
  }
}
function finishPlace(place, msg) {
  P.done[place.id] = true;
  P.visits++;
  $("mapLog").textContent = place.name + " — " + msg;
  if (P.hp <= 0) return gameOver(false);
  if (P.visits >= 6) return ending();
  buildMap();
  show("map");
}
function startFight(place, c) {
  combat = { place, foe: c.foe, ehp: c.hp, guard: false };
  $("cbName").textContent = c.foe;
  $("cbText").textContent = c.foe + " te barre la route.";
  $("cbLog").textContent = "";
  drawFight();
  show("combat");
}
function drawFight() {
  $("cbHp").textContent = "Toi " + P.hp + " PV  ·  " + combat.foe + " " + combat.ehp;
}
function hit() {
  const d = 2 + P.fight + Math.floor(Math.random() * 4);
  combat.ehp -= d;
  $("cbLog").textContent = "Tu portes " + d + ".";
  if (combat.ehp <= 0) {
    P.gold += 8; P.honor += 1;
    finishPlace(combat.place, "Victoire. +8 or.");
    combat = null; return;
  }
  enemyHit();
}
function enemyHit() {
  let d = 1 + Math.floor(Math.random() * 4);
  if (combat.guard) d = Math.max(0, d - 2);
  combat.guard = false;
  P.hp -= d;
  $("cbLog").textContent += " Il rend " + d + ".";
  drawFight();
  if (P.hp <= 0) gameOver(false);
}
function gameOver(win) {
  $("endTitle").textContent = win ? "Bannière haute" : "Tombé";
  $("endText").textContent = win
    ? ("Maison " + HOUSES[P.house].name + ". Or " + P.gold + ", honneur " + P.honor + ". On se souviendra.")
    : "Le chemin s’arrête ici. Recommence, change tes serments.";
  show("end");
}
function ending() {
  const good = P.honor >= 5 && P.hp > 4;
  gameOver(good);
}

$("startBtn").onclick = () => { newQuiz(); show("quiz"); renderQ(); };
$("loadBtn").onclick = () => {
  try {
    const raw = localStorage.getItem("got-run");
    if (!raw) { $("mapLog") && ($("mapLog").textContent = "Rien à reprendre."); return; }
    P = JSON.parse(raw);
    buildMap(); show("map");
  } catch (e) {}
};
$("backBtn").onclick = () => { if (i > 0) { i--; renderQ(); } else show("title"); };
$("nextBtn").onclick = () => {
  if (picks[i] < 0) return;
  if (i === deck.length - 1) tally();
  else { i++; renderQ(); }
};
$("toMapBtn").onclick = () => { buildMap(); show("map"); };
$("evBack").onclick = () => show("map");
$("atkBtn").onclick = hit;
$("defBtn").onclick = () => { combat.guard = true; $("cbLog").textContent = "Garde haute."; enemyHit(); };
$("fleeBtn").onclick = () => { P.honor -= 1; finishPlace(combat.place, "Tu fuis. Honor -1."); combat = null; };
$("invBtn").onclick = () => {
  $("bagText").textContent = (P.items.join(", ") || "Vide.") + "  ·  visites " + P.visits + "/6";
  show("bag");
};
$("bagClose").onclick = () => show("map");
$("saveBtn").onclick = () => {
  localStorage.setItem("got-run", JSON.stringify(P));
  $("mapLog").textContent = "Sauvegardé dans ce navigateur.";
};
$("againBtn").onclick = () => { P = null; show("title"); };
</script>
</body>
</html>
